# agentic-workflow-foundation の初期設定。
# このファイルを apply_kit_init.py が読み、root manifest.yaml へ反映する。
# workflow は開発型固定。feature の有効・無効はこのファイルでは設定しない。
# 記法: block style のみ / インデントは半角スペース2。

# 設定スキーマのバージョン。現在は 1 固定で変更しない。
version: 1

project:
  # 生成される AGENTS.md などに表示するプロジェクト名。
  # null またはキー省略時は、実行先リポジトリのディレクトリ名を使う。
  # slug はこの値から自動生成されるため、通常は null のままでよい。
  name: agentic-workflow-foundation-kit

# Phase 1.6 で ingest_tech_stack.py が読む技術スタック統一設計書。
# 配置ディレクトリは .cursor/docs/ 固定。ファイル名のみ指定する。
# AI_AGENT_UNIFIED_DESIGN / AI_BUSINESS_AGENT_SUITE はここに書かない
# （kit 実行時の immutable upstream SoT として常に固定参照）。
tech_stack_design:
  filename: TECHNOLOGY_STACK_UNIFIED_DESIGN.md

# tech_contract の承認ポリシー（PO 明示の opt-in）。
# auto_approve: true のとき、対話 SKILL は validate PASS 後に AskQuestion を出さず
# tech_contract.py apply で pin する。責任の所在は本ファイル（PO が書いた設定）。
# 省略時 / false は従来どおり AskQuestion で明示承認。
# provisioning（bin/project-setup --apply）は下記の別ポリシーで扱う。
tech_contract:
  auto_approve: true

# Phase 1.68 provisioning の対話承認ポリシー（PO 明示の opt-in）。
# auto_approve: true は plan 検証後の AskQuestion だけを省略する。
# --approve-plan の digest 検証は維持し、承認済み tech_contract に宣言された
# file / command action（network / host write を含む）を実行する。
# sealed tech_contract.provisioning.preflight_checks とは別の対話ポリシー。
provisioning:
  auto_approve: true

# AI の GitHub 認証 provider（Phase 1.5 で root manifest.yaml > github_access へ投影）。
#
# 対象（kit が統制する経路）:
#   - GitHub API: bin/github-pr-*-safe / bin/github-issue-*-safe 等
#   - AI の HTTPS Git: fetch / pull / push / clone（bin/github-git-fetch-safe 等）
# 対象外:
#   - ユーザーが端末で直接行う SSH git（kit は変更しない）
#   - gh CLI 直実行（Hook で deny。wrapper 経由のみ）
#
# 設計原則:
#   - api_credential_provider は GitHub API と HTTPS Git の単一 SoT。併用不可。
#   - token / PAT / JWT 本体は本ファイルにも manifest にも保存しない。
#   - 実体は GitHub App（~/.config/github-apps/）または macOS Keychain（PAT）側。
#   - 詳細セットアップ手順は setup.md §4 を参照。
#
# api_credential_provider — 使用する backend（省略時 github_app）:
#   github_app:
#     対象 owner/repo の GitHub App installation を動的解決し、
#     installation token を API / Git に使う。Installation ID の固定設定は不要。
#     App ID / private key はリポジトリ外（例: ~/.config/github-apps/config.env）に置く。
#     この選択中、下記 keychain.* は認証取得では参照されない（空 account 可）。
#   keychain:
#     macOS Keychain の generic password から PAT を service/account 完全一致で取得。
#     macOS 専用。非 macOS では wrapper が exit 2。
#     この選択時のみ keychain.account は非空必須。
#
# keychain — provider=keychain のときだけ認証に使う locator（PAT 本体は Keychain の Password 欄）:
#   service:
#     Keychain 属性 svce（サービス名）と完全一致させる。省略時 agentic-workflow-github-api。
#     一覧の「名前」列（表示ラベル）とは別物。属性画面で svce を確認すること。
#   account:
#     Keychain 属性 acct（アカウント名）と完全一致させる PO 定義の識別子。
#     GitHub ログイン名である必要はない。Keychain 登録時に付けた名前をそのまま書く。
#     provider=github_app では未使用のため空文字可。
#     provider=keychain では非空必須（制御文字・shell 展開文字 " \ $ ` は不可）。
github_access:
  api_credential_provider: github_app
  keychain:
    service: agentic-workflow-github-api
    account: agent-github-access

context_budget:
  # 使用する全モデルのうち、最小のコンテキストウィンドウを token 単位で指定する。
  # 複数モデルを使う場合は最大値ではなく最小値を設定する。
  # この値から Yellow / Red の handoff 閾値を自動算出する。
  # 例: 200K モデルを含む場合は 200000、300K モデルのみなら 300000。
  # 省略時の既定値・推奨値は 200000。
  min_context_window_tokens: 200000
