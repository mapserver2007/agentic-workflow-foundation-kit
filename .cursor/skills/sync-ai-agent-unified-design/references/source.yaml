# sync-ai-agent-unified-design 取得設定（PO 記入欄）
#
# private リポジトリ上の「3つの統一設計書」Markdown を .cursor/docs/ に同期するための設定。
# files[*].src（repo 内パス）が [要確認] の間は、そのファイルは取得対象外。

repository: "mapserver2007/ai-agent-unified-design"  # private リポジトリ owner/repo（確定）
ref: "main"                 # 取得するブランチ/タグ
fetch_method: "auto"        # auto（MCP優先→gh CLIフォールバック） | mcp | gh
overwrite: "diff"           # diff（内容差分時のみ上書き） | always

files:
  - src: "AI_AGENT_UNIFIED_DESIGN.md"
    dest: ".cursor/docs/AI_AGENT_UNIFIED_DESIGN.md"
  - src: "AI_BUSINESS_AGENT_SUITE.md"
    dest: ".cursor/docs/AI_BUSINESS_AGENT_SUITE.md"
  - src: "TECHNOLOGY_STACK_UNIFIED_DESIGN.md"
    dest: ".cursor/docs/TECHNOLOGY_STACK_UNIFIED_DESIGN.md"
