# ============================================================
# manifest.yaml — Agentic Workflow 基盤 YAML 正本（Source of Truth）
# ============================================================
# このファイルが基盤ファイル群の唯一の定義元（BAS:「Markdownは表現・YAMLは定義」）。
# scripts/generate.py が本ファイル + templates/ から出力ファイルを決定論的に生成する。
# 出力ファイルを直接編集してはならない（audit.py が drift として exit 1 にする）。
#
# 記法制約（同梱の最小YAMLローダのサブセット）:
#   - block style のみ（flow の {..} / [..] は使わない）
#   - インデントは半角スペース2
#   - 複数行テキストは "|" ブロックリテラルを使う
# ============================================================

version: 1

# 生成エンジン（agentic-workflow-engine）の marker モードで使うマーカー識別子。
# 既定値は移設前のハードコード値と一致し、既存 .gitignore / .cursorignore の
# 管理ブロックとの後方互換を保つ。
marker_id: agentic-foundation

# ------------------------------------------------------------
# (1) 自己完結 SoT 宣言
#     本 manifest + templates が一次 SoT。統一設計書 unified/bas は本 skill 作成時に
#     内部化済みの「設計由来メモ（非権威）」であり、生成時に参照しない（drift 機構は撤去）。
#     技術スタックは techstack 設計書（プロジェクト別ポリシー源）からトップレベル
#     tech_stack へ Phase 1.6（ingest_tech_stack.py）で取り込む。
# ------------------------------------------------------------

# ------------------------------------------------------------
# (2) framework 要件（自己完結 SoT のフレームワーク定義）
#     unified/bas 由来の思想を内部化したもの。変更は設計書改版ではなく、本 manifest を
#     直接編集する設計判断（PO 承認）として行う。
# ------------------------------------------------------------
framework:
  naming:
    meta_pattern: "UPPER_SNAKE_CASE.md"
    domain_pattern: "kebab-case.md"
    official_fixed:
      - AGENTS.md
      - CLAUDE.md
      - CLAUDE.local.md
      - MEMORY.md
  hook_events:
    - sessionStart
    - beforeSubmitPrompt
    - afterShellExecution
    - beforeShellExecution
    - stop
  exit_codes:
    - code: 0
      meaning: 全検査PASS。次フェーズへ進む
    - code: 1
      meaning: 検査失敗（修正可能）。FAIL項目を修正し再実行（Advisoryループ）
    - code: 2
      meaning: 致命的エラー（引数不正/ファイル不在/スクリプト破損）。ループ中断しユーザー報告
  design_dimensions:
    - id: D-BOUNDARY
      desc: Boundaries（Always/Ask First/Never）の追加・変更
    - id: D-WORKFLOW
      desc: ワークフロー / Session Protocol の構造変更
    - id: D-NAMING
      desc: Documentation Naming Convention（semantic 2層モデル）の変更
    - id: D-QUALITY
      desc: 品質ゲートのセマンティクス / exit code / 例外承認フローの変更
    - id: D-ARCH
      desc: アーキテクチャのレイヤー責務 / トランザクション境界の変更
    - id: D-SOT
      desc: Source of Truth の定義変更
    - id: D-DEPENDENCY
      desc: 新しい外部依存（package / API / infra）の導入
    - id: D-PATTERN
      desc: 複数箇所で採用される新実装パターンの導入
  accd_axes:
    - id: A
      name: 制約の補完
      impl: "[要確認] 永続化された制約の置き場（reports / AGENTS.md 参照順序 / rules）"
    - id: B
      name: 専念の委譲
      impl: "[要確認] 機械的判定（品質ゲート / guard hook）"
    - id: C
      name: 認知的多様性
      impl: "[要確認] 自己反論 / subagent 並列探索 / 複数視点レビュー"
    - id: D
      name: 段階的圧縮
      impl: "[要確認] テンプレート必須セクション / handoff manifest / Progressive Disclosure"
    - id: E
      name: 自律的進化
      impl: "GOTCHAS.md 集約 / DECISIONS.md(ADR) / Hook 昇格パス（同一違反3回観測）"
  agent_conduct:
    - id: Humble
      rule: 根拠なし同意の禁止。同意前にコード/docsで裏取りし根拠を1行で示す
    - id: Cautious
      rule: 修正前の証拠収集。再現条件/影響範囲/既存実装パターンの3点を明示してから提案
    - id: Thorough
      rule: 対症療法の禁止。テスト失敗をskip/抑制する前に原因仮説を文章化
    - id: Selective
      rule: 完了の自己宣言禁止。ゲート実行記録なしに「完了」と書かない
  budget_thresholds:
    yellow:
      elapsed_min: 45
      prompt_count: 45
      shell_bytes: 1048576
    red:
      elapsed_min: 90
      prompt_count: 90
      shell_bytes: 5242880
# ------------------------------------------------------------
# (2c) tech_stack — プロジェクト・パラメータ層（per-project 入力 / Phase 1.6 取り込み）
#   framework.* と違い「凍結フレームワーク定義」ではなく、プロジェクト毎に変動する。
#   ingest_tech_stack.py が techstack 設計書 §9 表を decode し、実 package.json があれば
#   実態優先でバージョンを上書きして本ブロック（note / items）へ書き戻す。
#   templates/docs/tech-stack.md.template が tech_stack.note / tech_stack.items を描画する。
# ------------------------------------------------------------
tech_stack:
  note: "下表は本書執筆時点（2026-06）の現行安定版を基準にした方針であり、固定バージョンの宣言ではない。実際の固定は各 package.json / wrangler.jsonc で行う。「最終リリースが古く後継がある」ライブラリは採用しない。"
  items:
    - layer: "実行基盤"
      technology: "Cloudflare Workers"
      version_policy: "—"
      note: "`workerd` ランタイム"
    - layer: "デプロイ CLI"
      technology: "Wrangler"
      version_policy: "v4 系"
      note: "OpenNext 利用時は 3.99.0 以上必須、実質 v4 推奨"
    - layer: "Frontend"
      technology: "Next.js"
      version_policy: "15 / 16 系"
      note: "14 は OpenNext 側で 2026 Q1 にサポート終了"
    - layer: "Next.js アダプタ"
      technology: "`@opennextjs/cloudflare`"
      version_policy: "1.x 系（GA）"
      note: "公式推奨。`next-on-pages` は不採用"
    - layer: "Backend"
      technology: "Hono"
      version_policy: "4 系"
      note: "Workers ネイティブ"
    - layer: "API 定義"
      technology: "OpenAPI"
      version_policy: "3.1"
      note: "JSON Schema 2020-12 準拠"
    - layer: "OpenAPI lint"
      technology: "Spectral"
      version_policy: "6 系"
      note: "ルールセットをリポジトリで管理"
    - layer: "OpenAPI bundle/diff"
      technology: "Redocly CLI"
      version_policy: "1 系"
      note: "`bundle` / `lint` / breaking diff"
    - layer: "型生成"
      technology: "openapi-typescript"
      version_policy: "7 系"
      note: "OpenAPI 3.1 対応"
    - layer: "フロント client"
      technology: "openapi-fetch"
      version_policy: "0.x（安定）"
      note: "メンテナンスモードだが本番安定"
    - layer: "データ取得統合"
      technology: "openapi-react-query"
      version_policy: "0.x"
      note: "TanStack Query 統合（任意）"
    - layer: "自動生成 client（代替）"
      technology: "Orval"
      version_policy: "7 系"
      note: "React Query/SWR フックを自動生成したい場合の代替"
    - layer: "Mock"
      technology: "Prism"
      version_policy: "5 系"
      note: "OpenAPI モックサーバー（3.1 は一部制約あり）"
    - layer: "契約テスト"
      technology: "Vitest + `@cloudflare/vitest-pool-workers`"
      version_policy: "—"
      note: "`workerd` 上でテスト実行"
    - layer: "ランタイム言語"
      technology: "TypeScript"
      version_policy: "5 系"
      note: "strict"
    - layer: "パッケージ管理"
      technology: "pnpm"
      version_policy: "9 系以降"
      note: "workspace"
    - layer: "タスク管理"
      technology: "Turborepo"
      version_policy: "2 系"
      note: "任意"

# ------------------------------------------------------------
# (2d) session — Layer 3 セッション管理（親へ内包）
#   session-planning / session-handover / decisions-record は本 manifest の
#   outputs[] から生成する。project.* は同一 manifest 内の値を直接参照する。
# ------------------------------------------------------------
session:
  large_task_threshold:
    files: 5
    subtasks: 3
  verification:
    gate_command: "[要確認] 例: project.quality_gate.test_cmd 等"

# ------------------------------------------------------------
# (2b) outputs — 生成対象ファイルの機械可読カタログ（audit/generate の SoT）
#   mode: render = テンプレート全展開 / marker = マーカーブロックを既存ファイルへ upsert
#   required_sections: 生成結果に必ず含まれるべき文字列（設計書準拠の機械検査）
#       設計書由来の根拠は references/design-conformance.md を参照
# ------------------------------------------------------------
outputs:
  - path: AGENTS.md
    template: AGENTS.md.template
    mode: render
    required_sections:
      - "## Workflow Pattern"
      - "## Documentation Naming Convention"
      - "## Agent Role"
      - "## Session Protocol"
      - "## Boundaries"
      - "## Gotchas"
  - path: CLAUDE.md
    template: CLAUDE.md.template
    mode: render
    required_sections:
      - "@AGENTS.md"
  - path: .cursor/rules/00-init.mdc
    template: rules/00-init.mdc.template
    mode: render
    required_sections:
      - "alwaysApply: true"
  - path: .cursor/rules/01-critical-constraints.mdc
    template: rules/01-critical-constraints.mdc.template
    mode: render
    required_sections:
      - "alwaysApply: true"
  - path: .cursor/rules/02-agent-conduct.mdc
    template: rules/02-agent-conduct.mdc.template
    mode: render
    required_sections:
      - "Humble"
      - "Cautious"
      - "Thorough"
      - "Selective"
  - path: .cursor/hooks/guard-git-write.sh
    template: hooks/guard-git-write.sh.template
    mode: render
    executable: true
    required_sections:
      - "beforeShellExecution"
      - "permission"
  - path: .cursor/hooks/session-bootstrap.sh
    template: hooks/session-bootstrap.sh.template
    mode: render
    executable: true
    required_sections:
      - "additional_context"
  - path: .cursor/hooks/session-budget-tracker.sh
    template: hooks/session-budget-tracker.sh.template
    mode: render
    executable: true
    required_sections:
      - "prompt_count"
  - path: .cursor/hooks/session-shell-tracker.sh
    template: hooks/session-shell-tracker.sh.template
    mode: render
    executable: true
    required_sections:
      - "shell_bytes"
  - path: .cursor/hooks/session-budget-evaluator.sh
    template: hooks/session-budget-evaluator.sh.template
    mode: render
    executable: true
    required_sections:
      - "CONTEXT_BUDGET"
      - "followup_message"
  - path: .cursor/hooks/README.md
    template: hooks/README.md.template
    mode: render
    required_sections:
      - "fail_open"
  - path: .cursor/hooks.json
    template: hooks.json.template
    mode: render
    required_sections:
      - '"version": 1'
      - "sessionStart"
      - "stop"
  - path: docs/AGENT_RUNBOOK.md
    template: docs/AGENT_RUNBOOK.md.template
    mode: render
    required_sections:
      - "ACCD"
      - "5層モデル"
      - "復旧プロトコル"
  # DECISIONS.md / GOTCHAS.md は ADR / Gotchas を継続追記する append-log。
  # render だと generate のたびに追記内容を上書き消失させるため seed モード
  # （存在しなければ初期生成・存在すれば不可侵）にする。詳細は ADR-0006。
  - path: docs/DECISIONS.md
    template: docs/DECISIONS.md.template
    mode: seed
    required_sections:
      - "D-BOUNDARY"
      - "D-PATTERN"
      - "Significance"
      - "Alternatives Considered"
  - path: docs/GOTCHAS.md
    template: docs/GOTCHAS.md.template
    mode: seed
    required_sections:
      - "起票トリガー"
      - "Observe"
  - path: docs/QUALITY_GATE.md
    template: docs/QUALITY_GATE.md.template
    mode: render
    required_sections:
      - "exit code"
      - "Hook"
      - "リンク衛生"
  - path: docs/session-handoff-guide.md
    template: docs/session-handoff-guide.md.template
    mode: render
    required_sections:
      - "CONTEXT_BUDGET"
      - "handoff-active.md"
  # techstack 設計書 §9 由来の Domain 層サマリ（下流の Design Doc / AI レポートが参照）。
  - path: docs/tech-stack.md
    template: docs/tech-stack.md.template
    mode: render
    required_sections:
      - "技術スタック一覧とバージョン方針"
      - "TECHNOLOGY_STACK_UNIFIED_DESIGN.md"
  # Layer 3 セッション管理スキル群（親 manifest に内包）。
  - path: .cursor/skills/session-planning/SKILL.md
    template: skills/session-planning/SKILL.md.template
    mode: render
    required_sections:
      - "name: session-planning"
      - "## 大規模タスクの検知"
      - "## パターン選択フロー"
      - "## 追跡ドキュメント"
      - "## Gotchas"
  - path: .cursor/skills/session-handover/SKILL.md
    template: skills/session-handover/SKILL.md.template
    mode: render
    required_sections:
      - "name: session-handover"
      - "## 検証ゲート"
      - "## リンク衛生"
      - "## 再開プロトコル"
      - "## Gotchas"
  - path: .cursor/skills/session-handover/scripts/verification-gate.sh
    template: skills/session-handover/scripts/verification-gate.sh.template
    mode: render
    executable: true
    required_sections:
      - "session.verification.gate_command"
      - "=== verification gate ==="
  - path: .cursor/skills/decisions-record/SKILL.md
    template: skills/decisions-record/SKILL.md.template
    mode: render
    required_sections:
      - "name: decisions-record"
      - "D-BOUNDARY"
      - "Alternatives Considered"
      - "## Gotchas"
  - path: .gitignore
    template: gitignore.block.template
    mode: marker
  - path: .cursorignore
    template: cursorignore.block.template
    mode: marker

# ------------------------------------------------------------
# (3) project_overrides — プロジェクト固有値
#     本ツールキットは新規リポジトリにコピーして実行する配布モデル。project.* は
#     (a) AskQuestion(workflow_pattern のみ) / (b) 自動導出(name/slug/tracking_artifact/quality_gate) /
#     (c) 固定値(one_liner/agent_role/priorities/boundaries/doc_navigation = 本基盤の機能説明)
#     の3分類で確定する（SKILL.md Phase 1.5 参照）。自由入力・PO 直接手入力は廃止。
#     未確定で残った "[要確認]"（実質 workflow_pattern のみ）は audit が WARN として列挙する（FAIL ではない）。
# ------------------------------------------------------------
project:
  # コピー先（実行先）リポジトリのディレクトリ名から自動導出する（PO には問わない）。
  # 本ツールキットは新規リポジトリにコピーして実行する配布モデルのため、固定文字列を焼き込まない。
  name: "[自動導出] コピー先リポジトリのディレクトリ名"
  # name から自動導出（小文字化・空白をハイフン化）。PO には問わない
  slug: "[自動導出] name から導出"
  # 固定値（本基盤が表す機能の説明。PO には問わない）。
  one_liner: "自己完結した manifest + templates を SoT とし、Agentic Workflow 基盤ファイル群を冪等・再現的に生成/メンテナンスする（技術スタックは techstack 設計書から動的取り込み）"
  # AskQuestion(多肢選択) で確定。開発型 / パイプライン型 / ドキュメント型 / ハイブリッド
  workflow_pattern: "[要確認]"
  # workflow_pattern から決定論マッピングで自動確定
  tracking_artifact: "[要確認]"
  # 固定値（本基盤が表す機能の説明。PO には問わない）。
  agent_role: "自己完結 SoT（manifest + templates）から Agentic Workflow 基盤ファイル群を決定論的に生成・監査・メンテナンスするエージェント"
  # 固定値（PO には問わない）。
  priorities:
    - "冪等性と Source of Truth 一元化（manifest → 出力）を最優先する"
    - "出力ファイルの直接編集ではなく manifest/templates 経由の再生成で変更する"
    - "仕様は docs(SoT)で裏取りし、推測で断定しない（BAS Humble）"
  # tech_stack はトップレベル tech_stack（per-project 入力 / Phase 1.6 取り込み）へ移管。
  # PO 記入欄ではなくプロジェクト別ポリシー源（techstack 設計書）から取り込む。
  # 決定論マッピングで自動導出（PO には問わない / AskQuestion 廃止）。
  # workflow_pattern（ゲート戦略）× tech_stack（ツール系統）
  # から導出する。固定スタック(pnpm/Turborepo/Vitest)の開発型は pnpm build/lint/test を既定とし、
  # 実リポジトリ(package.json/Makefile 等)があればその実コマンドを優先(上書き)する。
  # 導出も実証拠も無い例外時のみ「該当なし」とし quality_gate を設定しない(推測で断定しない)。
  quality_gate:
    build_cmd: "[要確認] 例: pnpm build"
    lint_cmd: "[要確認] 例: pnpm lint"
    test_cmd: "[要確認] 例: pnpm test"
    # 任意。PO が「不要」なら [要確認] のままスキップ可
    extra:
      - "[要確認] 追加ゲート（任意）"
  # 固定値（本基盤の運用制約。PO には問わない）。
  boundaries:
    always:
      - "出力ファイルを直接編集しない（manifest.yaml / templates を編集して再生成する）"
      - "変更前に関連ファイルを全体読み込みする"
    ask_first:
      - "framework.* の変更（Meta 層の設計判断）"
      - "git commit / push などの履歴操作"
    # never の git 不可逆操作は framework 固定（guard-git-write.sh で deterministic deny）。
    never_extra:
      - "自己完結 SoT（manifest / templates）を迂回して生成物（AGENTS.md / rules / hooks / docs）を直接改変する"
  # 固定値（生成物 docs/tech-stack.md を指す。PO には問わない）。
  doc_navigation:
    domain:
      - path: "docs/tech-stack.md"
        desc: "技術スタック方針（tech_stack 由来の Domain 層サマリ・生成物）"
