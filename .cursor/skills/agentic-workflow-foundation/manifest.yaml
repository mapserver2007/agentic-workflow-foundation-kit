# ============================================================
# manifest.yaml — Agentic Workflow 基盤 seed manifest
# ============================================================
# このファイルは agentic-workflow-foundation スキルに内包される汎用 seed。
# スキル実行時に本 seed をもとに、リポジトリ直下 manifest.yaml が正式生成される。
# 生成後の root manifest は PO が評価する。
# 出力ファイルを直接編集してはならない（audit.py が drift として exit 1 にする）。
#
# 記法制約（同梱の最小YAMLローダのサブセット）:
#   - block style のみ（flow の {..} / [..] は使わない）
#   - インデントは半角スペース2
#   - 複数行テキストは "|" ブロックリテラルを使う
# ============================================================

version: 1

# 生成エンジン（agentic-workflow-engine）の marker モードで使うマーカー識別子。
# 既定値は移設前のハードコード値と一致し、既存 .gitignore / .cursorignore の
# 管理ブロックとの後方互換を保つ。
marker_id: agentic-foundation

# ------------------------------------------------------------
# (1) seed SoT 宣言
#     本 manifest + templates は root manifest 生成前の汎用 seed / schema / default。
#     統一設計書 unified/bas は immutable upstream SoT として run_resolved_engine.py が読み取り、
#     毎回一時 resolved manifest に展開する。seed 自体は実行結果で永続更新しない。
#     技術スタックは techstack 設計書（プロジェクト別ポリシー源）から、スキル実行で生成される
#     リポジトリ直下 manifest.yaml の tech_stack へ Phase 1.6（ingest_tech_stack.py）で取り込む。
# ------------------------------------------------------------

# ------------------------------------------------------------
# (2) framework 要件（自己完結 SoT のフレームワーク定義）
#     unified/bas 由来の思想と、resolver が展開するための schema/default を保持する。
#     変更は upstream 設計書または本 manifest/templates の設計判断として扱う。
# ------------------------------------------------------------
framework:
  naming:
    meta_pattern: "UPPER_SNAKE_CASE.md"
    domain_pattern: "kebab-case.md"
    official_fixed:
      - AGENTS.md
      - CLAUDE.md
      - CLAUDE.local.md
      - MEMORY.md
  hook_events:
    - sessionStart
    - beforeSubmitPrompt
    - afterShellExecution
    - beforeShellExecution
    - stop
    - preCompact
    - afterAgentResponse
    - afterAgentThought
  exit_codes:
    - code: 0
      meaning: 全検査PASS。次フェーズへ進む
    - code: 1
      meaning: 検査失敗（修正可能）。FAIL項目を修正し再実行（Advisoryループ）
    - code: 2
      meaning: 致命的エラー（引数不正/ファイル不在/スクリプト破損）。ループ中断しユーザー報告
  # 追跡ドキュメント（.cursor/.tracking/tracker-{session_id}.md）が満たすべき必須セクションの SoT。
  # session-planning テンプレ（追跡ドキュメント作成ガイド）と plan-gate.sh（機械検査）が同一リストを参照する。
  # handoff.manifest_required_sections と同じ単一 SoT 方式。重量機構（Finding Code 79 / 数値判定）は採用しない。
  plan_required_sections:
    - "目的と完了条件"
    - "スコープ"
    - "タスク分解"
    - "検証ゲート"
    - "完了チェック"
    - "レビュー完了承認"
    - "例外承認記録"
  design_dimensions:
    - id: D-BOUNDARY
      desc: Boundaries（Always/Ask First/Never）の追加・変更
    - id: D-WORKFLOW
      desc: ワークフロー / Session Protocol の構造変更
    - id: D-NAMING
      desc: Documentation Naming Convention（semantic 2層モデル）の変更
    - id: D-QUALITY
      desc: 品質ゲートのセマンティクス / exit code / 例外承認フローの変更
    - id: D-ARCH
      desc: アーキテクチャのレイヤー責務 / トランザクション境界の変更
    - id: D-SOT
      desc: Source of Truth の定義変更
    - id: D-DEPENDENCY
      desc: 新しい外部依存（package / API / infra）の導入
    - id: D-PATTERN
      desc: 複数箇所で採用される新実装パターンの導入
  accd_axes:
    - id: A
      name: 制約の補完
      adopted: "AGENTS.md 参照順序 / .cursor/rules/*.mdc / 追跡ドキュメント / handoff manifest"
      not_adopted: "YAML 正本 + Markdown 生成 / Context Loading Table の機械検証"
    - id: B
      name: 専念の委譲
      adopted: "品質ゲート / verification-gate.sh / session-start-gate.sh / guard-git-write.sh / 軽量検査ID"
      not_adopted: "Finding Code 79 種体系 / Deterministic Guard の数値判定基盤"
    - id: C
      name: 認知的多様性
      adopted: "Task subagent 並列探索 / 自己反論 / review スキル / dual-thinking（A/B 並列分析 + C 独立裁定）"
      not_adopted: "engine / model resolver による異モデル強制"
    - id: D
      name: 段階的圧縮
      adopted: "templates required_sections / handoff manifest / Documentation Navigation / 追跡ドキュメント完了時削除"
      not_adopted: "提案書 7 ステップパイプライン"
    - id: E
      name: 自律的進化
      adopted: "GOTCHAS.md 集約 / DECISIONS.md(ADR) / Hook 昇格パス（同一違反3回観測）"
      not_adopted: "仮説シミュレーション全タスク必須化"
  agent_conduct:
    - id: Humble
      rule: 根拠なし同意の禁止。同意前にコード/docsで裏取りし根拠を1行で示す
    - id: Cautious
      rule: 修正前の証拠収集。再現条件/影響範囲/既存実装パターンの3点を明示してから提案
    - id: Thorough
      rule: 検証の網羅。ゲート未実行で完了宣言禁止、対症療法（skip/抑制）前に原因仮説を文章化
    - id: Selective
      rule: 出力の自己レビュー。提出前に「文脈のない読み手が正しく理解・判断できるか」を検証する
  budget_thresholds:
    # resolve_budget_thresholds.py が project.context_budget.min_context_window_tokens から算出。
    # 以下は 200K tier のデフォルト。Phase 1.55 resolver が上書きする。
    min_context_window_tokens: 200000
    compact_yellow_percent: 60
    compact_red_percent: 78
    compact_freshness_sec: 300
    compact_thrashing_count: 3
    max_injection_bytes: 8192
    max_snapshot_bytes: 8192
    yellow:
      prompt_count: 35
      shell_bytes: 768000
      shell_bytes_label: "750 KiB"
    red:
      prompt_count: 70
      shell_bytes: 4194304
      shell_bytes_label: "4 MiB"
    checkpoint_interval_prompts: 15
  handoff:
    source_policy: "統一設計書を immutable upstream SoT として読み取り、seed default と root manifest を合成した一時 resolved manifest に展開する"
    purpose: "長時間セッションによる Lost in the Middle とコンテキストドリフトを防ぎ、新規チャットで作業状態を再構築する"
    # 劣化の自覚を促す根拠論文と具体例。論文は移植性のため汎用引用のみ（プロジェクト固有チケットは含めない）。
    paper_citation: "根拠: Liu et al. (2023) 『Lost in the Middle: How Language Models Use Long Contexts』 (TACL)。長い文脈では入力の中央付近にある情報の利用率が相対的に下がることを実証した。"
    degradation_example: "具体例: 序盤で「この更新処理は必ずトランザクション境界内で実行する」と決めたのに、終盤では境界外に実装してしまう。序盤の制約が AI の注意から落ちるのが典型的な劣化症状で、早期に気づけると handoff のタイミングを逃しにくい。"
    user_invisible: "`.cursor/.session/` のファイルや session_id をユーザーが通常意識する必要はない"
    active_manifest_path: ".cursor/.session/handoff-{session_id}.md"
    consumed_manifest_pattern: ".cursor/.session/handoff-consumed-{orig_sid}-{unix}.md"
    snapshot_path_pattern: ".cursor/.session/pre-compact-{session_id}.md"
    state_glob: ".cursor/.session/{session_id}.json"
    state_files:
      - path: ".cursor/.session/{session_id}.json"
        role: "セッションごとの累積指標"
        lifecycle: "session-bootstrap.sh が新規作成し、tracker / evaluator が更新する"
      - path: ".cursor/.session/handoff-{session_id}.md"
        role: "セッションごとの active handoff manifest（並行セッション対応）"
        lifecycle: "AI が Yellow / Red 受信時に書き出し、session-bootstrap.sh が次セッションで消費する。並行セッションは独立した handoff ファイルを持つ"
      - path: ".cursor/.session/handoff-consumed-{orig_sid}-{unix}.md"
        role: "消費済み handoff manifest のアーカイブ（元セッション ID 付きでトレーサビリティ確保）"
        lifecycle: "session-bootstrap.sh が active manifest をリネームして作成する"
      - path: ".cursor/.session/compact-events.jsonl"
        role: "compact イベントの校正データログ"
        lifecycle: "session-compact-observer.sh が preCompact 発火時に追記する"
      - path: ".cursor/.session/{session_id}.pending-handoff"
        role: "compact 直後の handoff 発火トリガー（one-shot marker）"
        lifecycle: "compact-observer が書き、budget-evaluator が検出後に削除する"
      - path: ".cursor/.session/pre-compact-{session_id}.md"
        role: "preCompact 時の包括的構造化スナップショット（追跡ドキュメント + turns.jsonl 末尾 + state を統合した復旧用退避）"
        lifecycle: "compact-observer が preCompact 発火時に生成する。session-bootstrap.sh が次セッションで突合・注入に使用する"
      - path: ".cursor/.session/{session_id}.turns.jsonl"
        role: "全ターンの prompt + AI 応答 + thinking をゼロコストで記録する会話ログ"
        lifecycle: "session-response-tracker.sh / session-budget-tracker.sh が追記。preCompact でスナップショットに含まれる"
    user_actions:
      - warning: "[CONTEXT_BUDGET=YELLOW]"
        action: "現在の作業の区切りを意識し、区切りが見えたタイミングで Cmd+N を開く"
      - warning: "[CONTEXT_BUDGET=RED]"
        action: "すぐに Cmd+N で新規チャットを開き、同セッションで新規実装を続行しない"
    # action だけでなく理由を併記する。理由を読むことで「なぜ禁止か」が腑に落ち、
    # 引き継ぎ失敗（mis-consume / history-reopen）と劣化ゾーンでの継続を防ぐ。
    forbidden_after_red:
      - action: "別の新規チャットを途中で開く"
        reason: "意図しない handoff manifest が選択され、本来の再開チャットに正しい文脈が引き継がれない（mis-consume）"
      - action: "Cursor の過去チャット履歴を開き直して再開したつもりになる"
        reason: "sessionStart Hook が期待通り再発火せず、handoff manifest が注入されない（history-reopen）"
      - action: "同セッションで「もう少しだけ」と続行する"
        reason: "Lost in the Middle の劣化ゾーンで実装を続けることになり、品質劣化の主要失敗モードに陥る"
    failure_modes:
      - id: "mis-consume"
        symptom: "複数の handoff manifest が存在する場合に意図しないものが選択され、本来の文脈が再開チャットに注入されない"
        mitigation: "セッション固有ファイル名により自動分離される。2件以上検出時は bootstrap がユーザー選択 UI で保護する"
      - id: "history-reopen"
        symptom: "過去チャット履歴を開き直しても sessionStart Hook が期待通り再発火しない場合がある"
        mitigation: "Cmd+N で新規チャットを開き、短文を1通送って bootstrap に注入させる"
      - id: "heavy-short-session"
        symptom: "短時間でも大量ログや重い議論でコンテキスト劣化が先に進む"
        mitigation: "shell_bytes と prompt_count の OR 判定で早期検知する。必要なら手動で handoff を作る"
      - id: "compact-thrashing"
        symptom: "同一セッション内で compact が 3 回以上発生し、compact 後すぐに再びコンテキストが圧迫される"
        mitigation: "compact_thrashing_count に達した時点で強制 Red を発火し、新規チャットへ誘導する"
      - id: "stale-handoff"
        symptom: "放棄されたセッションの handoff-{session_id}.md が残存し、新規セッション起動時に 2+ 件として AskQuestion が発火する"
        mitigation: "bootstrap が handoff ファイルの mtime を確認し、選択肢としてリストする。自動クリーンアップは別タスクで対応予定"
    metric_updates:
      - metric: "プロンプト数"
        update: "beforeSubmitPrompt Hook でユーザー発話ごとに +1 する"
        reset: "新セッション起動で 0 に戻る"
      - metric: "シェル出力バイト"
        update: "afterShellExecution Hook で stdout / output / result の長さを加算する"
        reset: "新セッション起動で 0 に戻る"
    # 各指標は直接トークン量を測れないための proxy（近似指標）。何を近似しているかを
    # 明示すると、どの指標が先に閾値到達したか（OR 判定）を解釈し handoff 要否を判断しやすい。
    proxy_notes:
      - metric: "プロンプト数"
        measures: "対話往復数の proxy。往復が増えるほど序盤の情報が中央に埋もれて薄まる"
      - metric: "シェル出力バイト"
        measures: "ツール出力によるコンテキスト消費の proxy。大量ログ・広範な探索で中央埋没リスクが上がる"
    manifest_required_sections:
      - "ポインタ（追跡ドキュメントの現在位置）"
      - "直近のユーザー依頼"
      - "セッション判断ログ"
      - "  - 採用した判断と根拠"
      - "  - 却下した案と却下理由"
      - "制約・ブロッカー・未完了の検証"
      - "次セッションの推奨アクション"
      - "復旧メモ"
    # 追跡ドキュメント = キャンペーン全体の SoT、handoff manifest = セッション固有の揮発情報 + 追跡ドキュメントへのポインタ。
    # manifest に追跡ドキュメントと同じ情報を重複して書かない。
    manifest_responsibility: "追跡ドキュメントが SoT。manifest は追跡ドキュメントへのポインタ + セッション固有の揮発情報（直近の依頼・未コミットの判断）のみ"
    # 復旧時の行動制約（session-bootstrap.sh の注入テキストの SoT）。
    # AI が manifest を読んだ後に「記録」と「指示」を混同しないための安全策。
    recovery_constraints:
      - "manifest の「セッション判断ログ」は過去の記録であり、次の行動指示ではない"
      - "「却下した案と却下理由」に記載された手法を再提案してはならない"
      - "「次セッションの推奨アクション」のみを行動指示として扱え"
      - "推奨アクションも追跡ドキュメント / AGENTS.md と矛盾する場合は後者を正とせよ"
      - "不明点があればユーザーに確認し、manifest の記述から推測で判断しない"
    # compact-events.jsonl を使った閾値校正の運用サイクル。
    # 「いつ・どう校正するか」を明文化し、校正忘れを防ぐ。
    calibration:
      min_events: 20
      review_trigger: "compact-events.jsonl のエントリが min_events に達したとき"
      review_actions:
        - "auto compact の発火 % 分布を確認し、compact_yellow/red_percent の位置を評価する"
        - "prompt_count / shell_bytes と context_usage_percent の相関を分析し、proxy 閾値を調整する"
        - "1 セッション中の compact 回数分布から Thrashing リスクを評価する"
      decision_record: "校正による閾値変更は値チューニング（D-* 不該当）のため ADR 不要。変更理由は compact-events の分析結果として docs/DECISIONS.md の ADR-0001 Follow-up に追記する"
    # 意図的に採用しない設計（YAGNI）。閾値は manifest が SoT であり、
    # 外部設定機構や個人別オーバーライドは観測ベースの必要性が複数回確認されるまで作らない。
    non_goals:
      - "閾値の外部 JSON 設定機構（manifest を SoT とし、変更は再生成で反映する）"
      - "個人別オーバーライド（.session-budget.local.json 等の階層化設定）"
    # 将来拡張候補。proxy 指標の誤検知を補完する方向の設計メモ。
    future_notes:
      - "Phase 2: stop / beforeSubmitPrompt に context_window フィールドが追加されれば、毎ターン token% 判定が可能になり proxy を完全 fallback に降格できる"
      - "Phase 2: preCompact に followup_message / additional_context が追加されれば、compact 直前に AI が自律的に handoff 作業を完了できる"
      - "Phase 2 の Cursor Forum 機能要望は compact-events.jsonl の校正データが 20 件以上蓄積してから起票する（データに基づいた要望の方が説得力がある）"
    # 参考リンク。リポ内の安定リンクのみを焼き込み、プロジェクト固有チケットや
    # 未検証の外部引用は含めない（移植性とトレーサビリティの両立）。
    references:
      - label: "設計判断（採用根拠）"
        path: "docs/DECISIONS.md"
      - label: "Hook 技術詳細"
        path: ".cursor/hooks/README.md"
      - label: "AI 振る舞い規範"
        path: "AGENTS.md > Context Budget Protocol"
# ------------------------------------------------------------
# (2c) tech_stack — root manifest 生成用の seed（per-project 入力 / Phase 1.6 取り込み）
#   framework.* と違い「凍結フレームワーク定義」ではなく、プロジェクト毎に変動する。
#   配布時点では具体スタックを焼き込まず、プレーンな未取り込み状態を保持する。
#   スキル実行後は root manifest.yaml の tech_stack が正式な取り込み先になる。
# ------------------------------------------------------------
tech_stack:
  note: "未取り込み。Phase 1.6 で .cursor/docs/TECHNOLOGY_STACK_UNIFIED_DESIGN.md の §9 技術スタック表を取り込むと、プロジェクト固有の方針に置き換わる。"
  items:

# ------------------------------------------------------------
# (2d) session — Layer 3 セッション管理（親へ内包）
#   session-planning / session-handover / decisions-record は本 manifest の
#   outputs[] から生成する。スキル実行後は root manifest.yaml の session.verification
#   が正式な検証コマンドの置き場になる。
# ------------------------------------------------------------
session:
  tracker_always_required: true
  large_task_threshold:
    files: 5
    subtasks: 3
  verification:
    gate_command: "[要確認] Phase 1.65 で導出"

# ------------------------------------------------------------
# (2g) coderabbit — CodeRabbit 設定（tech_stack 従属 / Phase 1.66 自動決定）
#   Phase 1.66（resolve_coderabbit.py）が tech_stack.items から
#   有効/無効ツール・path_instructions・path_filters を決定論的に導出する。
#   以下は seed default。実プロジェクトでは resolve_coderabbit.py の出力で上書きされる。
# ------------------------------------------------------------
coderabbit:
  enabled: true
  language: "ja-JP"
  tools_enabled:
    - name: "markdownlint"
    - name: "yamllint"
    - name: "shellcheck"
    - name: "gitleaks"
    - name: "trufflehog"
    - name: "github-checks"
    - name: "ast-grep"
    - name: "skillspector"
    - name: "osv-scanner"
    - name: "actionlint"
    - name: "eslint"
    - name: "biome"
    - name: "oxc"
    - name: "oasdiff"
    - name: "hadolint"
  tools_disabled:
    - name: "ruff"
    - name: "pylint"
    - name: "flake8"
    - name: "phpstan"
    - name: "phpmd"
    - name: "phpcs"
    - name: "golangci-lint"
    - name: "detekt"
    - name: "rubocop"
    - name: "brakeman"
    - name: "swiftlint"
    - name: "clippy"
    - name: "pmd"
    - name: "fbinfer"
    - name: "clang"
    - name: "cppcheck"
    - name: "fortitude-lint"
    - name: "luacheck"
  path_filters:
    - "!**/*.lock"
    - "!**/*.generated.*"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/coverage/**"
    - "!**/__snapshots__/**"
    - "!**/.cursor/plans/**"
    - "!**/.cursor/.session/**"
    - "!**/tmp/**"
    - "!**/.DS_Store"
    - "!**/pnpm-lock.yaml"
  path_instructions:
    - path: "**/*.ts"
      instructions: "TypeScript strict モードのプロジェクトです。型安全性（any の回避、適切な型ガード）、エラーハンドリングの網羅性、null/undefined の安全な処理を重点的にレビューしてください。"
    - path: "**/*.tsx"
      instructions: "React コンポーネントのレビュー: アクセシビリティ（aria 属性、セマンティック HTML）、パフォーマンス（不要な再レンダリング、メモ化）、Server Component / Client Component の境界を確認してください。"
    - path: "**/workers/**"
      instructions: "Cloudflare Workers 環境のコードです。Node.js API ではなく Web Standard API を使用しているか、CPU 時間制限を意識した実装か、env バインディングの型安全性を確認してください。"
    - path: "**/*.yaml"
      instructions: "YAML ファイルのレビュー: スキーマバリデーションの整合性、OpenAPI 定義の場合は 3.1 仕様への準拠を確認してください。"
    - path: "**/*.test.*"
      instructions: "テストファイルのレビュー: エッジケースのカバレッジ、テスト間の独立性（shared state の排除）、アサーションが具体的かつ十分か確認してください。"
    - path: ".cursor/skills/**"
      instructions: "Cursor Agent Skill ファイルです。SKILL.md のフォーマット準拠とセキュリティリスクを確認してください。"
    - path: ".cursor/rules/**"
      instructions: "Cursor Rule ファイルです。ルール間の矛盾がないか、宣言的な制約として記述されているか確認してください。"
    - path: ".cursor/hooks/**"
      instructions: "Cursor Hook スクリプトです。シェルスクリプトの堅牢性と副作用のないべき等な動作を確認してください。"
    - path: "docs/**"
      instructions: "ドキュメントのレビュー: 他ドキュメントとの整合性と Meta 層 / Domain 層の命名規約準拠を確認してください。"
    - path: "manifest.yaml"
      instructions: "manifest.yaml は Agentic Workflow 基盤の Source of Truth です。変更が下流の生成物に正しく反映されるか確認してください。"

# ------------------------------------------------------------
# (2e) quality_gate_contract — root manifest 生成用の seed
#   Phase 1.65（resolve_quality_gate.py）が workflow_pattern × tech_stack から
#   G-* と package scripts が満たすべき contract を決定論的に書き込む。
#   ここでの責務は実 script 検出ではなく技術スタック由来の canonical contract の生成であり、
#   結果は package.json の有無に依存しない（実体は contract に追従する）。
# ------------------------------------------------------------
# (2d-2) domain_docs — Phase 1.67 で tech_stack から自動導出されるフィールド。
#   seed テンプレートの描画に必要な最小デフォルト。tech_stack 取り込み後に上書きされる。
domain_docs:
  primary_language: "[要確認]"
  framework: "[要確認]"
  test_framework: "[要確認]"
  package_manager: "[要確認]"
  database: "[要確認]"
  api_style: "[要確認]"
  architecture: "[要確認]"
  coding_standards_sections:
  data_model_sections:
  api_sections:
  workflow_sections:

quality_gate_contract:
  gen:
  build:
  lint:
  test:

# ------------------------------------------------------------
# (2f) code_review — agent-code-review スキル（オプション生成）
#   Phase 1.5 の AskQuestion で生成有無を決定する。
#   enabled: true の場合のみ outputs[] の feature: code_review エントリが生成対象になる。
#   run_resolved_engine.py の _filter_outputs_by_features() が outputs[] をフィルタする。
# ------------------------------------------------------------
code_review:
  enabled: false
  report:
    enabled: false
    output_dir: "docs/agent-tasks/reports"

# ------------------------------------------------------------
# (2g) github_pr — agent-github-pr スキル（オプション生成）
#   Phase 1.5 の AskQuestion で生成有無を決定する。
#   enabled: true の場合のみ outputs[] の feature: github_pr エントリが生成対象になる。
# ------------------------------------------------------------
github_pr:
  enabled: false

# ------------------------------------------------------------
# (2h) github_issue — agent-github-issue スキル（オプション生成）
#   Phase 1.5 の AskQuestion で生成有無を決定する。
#   enabled: true の場合のみ outputs[] の feature: github_issue エントリが生成対象になる。
# ------------------------------------------------------------
github_issue:
  enabled: false

# ------------------------------------------------------------
# (2i) agent_workflow — タスク実行ワークフロー docs + orchestrator スキル
#   Phase 1.5 の AskQuestion で生成有無を変更可能（seed default: true）。
#   enabled: true の場合のみ outputs[] の feature: agent_workflow エントリが生成対象になる。
#   docs/agent-tasks/agent-workflow/ 配下に 6 段階（①〜⑥、①の退出ゲートを内包）+ index + best-practices を生成する。
#   docs 反映対象スコープは project.doc_navigation.domain を SoT として再利用する。
#
#   orchestrator_skill: true の場合、.cursor/skills/workflow-orchestrator/SKILL.md を生成する。
#   maintenance_docs.enabled: true の場合、.cursor/skills/agent-maintenance-docs/SKILL.md を生成する。
# ------------------------------------------------------------
agent_workflow:
  enabled: true
  report_slug_format: "yyyy-mm-dd-slug"
  maintenance_docs:
    enabled: true
  gate_scripts: true
  orchestrator_skill: true
  # step envelope: 全 worker の終端結果（complete/incomplete/blocked/fatal）を保存する永続 artifact（決定 13 / 14）。
  # complete を含む全状態で書き出し、次ステップの入力・再開・機械検証に用いる。
  # 前ステップの envelope は次ステップの envelope と正式成果物の検証完了後に削除する。最終残存検査は archive gate が行う。
  artifact:
    dir: ".cursor/.artifacts"
    naming_pattern: "{report-slug}--{step}.md"
    envelope:
      format: "yaml-front-matter"
      required_fields:
        - "status"
        - "step"
      # I-4: front matter パーサー依存。PyYAML（yaml.safe_load）を唯一のパーサーとする。
      # 未導入・不正 front matter・未知必須フィールドは exit 2（致命的エラー）。
      parser: "python3-pyyaml"
      parser_missing_exit: 2
  step_gates:
    - id: step2
      desc: "計画→実装境界（必須セクション充足）"
      cmd: "plan-gate.sh report"
    - id: step2-report
      desc: "レポート構造検査（必須10セクション充足）"
      cmd: "gate-report.py"
    - id: step4
      desc: "実装→検証（コードゲート）"
      cmd: "code-gate"
    - id: step5
      desc: "検証→PR（検証ゲート）"
      cmd: "verification-gate.sh"
    - id: step6
      desc: "PR→完了（レビュー完了承認）"
      cmd: "plan-gate.sh review"
    - id: adr
      desc: "ADR 起票内容の機械検査"
      cmd: "gate-adr.py"
    - id: artifact
      desc: "Worker artifact envelope 検査"
      cmd: "gate-artifact.py"
    - id: redispatch
      desc: "re-dispatch 前の復元差分照合"
      cmd: "gate-redispatch.py"
    - id: archive
      desc: "完了チェック6項目 + 残存artifact検査 + archives移動検査"
      cmd: "archive-gate.sh"
  # ステップ別モデル設定（PO 決定値）。
  # config.yaml テンプレートがこの値を seed 初期値として使い、生成後は PO が直接 config.yaml を編集できる。
  # Step ⑤（PR レビュー）は親直接実行のため config 対象外（決定 12）。
  models:
    step1_investigation: "claude-4.6-opus-high-thinking"
    step2_report: "composer-2.5-fast"
    step3_implementation: "gpt-5.6-terra-medium"
    step4_testing: "composer-2.5-fast"
    step6_completion: "composer-2.5-fast"
  # モデル利用不可時の方針: ABORT（親が起動前に即終了・設定見直しを案内）
  model_unavailable: "ABORT"
  # チケット管理サービスの設定。gate-report.py がレポート検証時に参照する。
  # service: チケット管理サービス名 / format: 番号の正規表現パターン
  ticket:
    service: github
    format: "[0-9]+"

# ------------------------------------------------------------
# (2k) dual_thinking — 多角評価スキル（オプション生成）
#   Phase 1.5 の AskQuestion で生成有無を決定する。
#   enabled: true の場合のみ outputs[] の feature: dual_thinking エントリが生成対象になる。
#   A（推進視点）・B（反証視点）の並列 readonly subagent と C（統合裁定・親エージェント）で
#   内部的に多角分析を行い、通常のチャット返答と同じ体裁で応答する。
#   内部の A/B 分析プロセスはユーザーに表示しない。
#   C のモデルはスキル呼び出し時に選択し、A/B のモデルだけを設定する。
# ------------------------------------------------------------
dual_thinking:
  enabled: false
  models:
    analyst_a: "[要確認]"
    analyst_b: "[要確認]"
  execution:
    require_distinct_agents: true
    require_distinct_models: true
    model_unavailable: "ABORT"
    max_rounds: 3
    max_rebuttal_turns_per_issue: 1
    max_issues_per_round: 1
    stop_when: "NO_MATERIAL_ISSUES"
  static_gate:
    enabled: true
    checks:
      - id: G-DT-CONFIG-001
        desc: "必須キー・型・空値"
      - id: G-DT-MODEL-001
        desc: "require_distinct_models 時の A/B モデル重複"
      - id: G-DT-BUDGET-001
        desc: "再審上限（max_rounds / max_rebuttal_turns_per_issue / max_issues_per_round）の正の整数検査"
      - id: G-DT-POLICY-001
        desc: "model_unavailable / stop_when の契約値検査"
    not_verifiable:
      - "実モデル割当（Cursor Subagent API が返さない）"
      - "A/B の相互非参照（プロセス間隔離を外部観測できない）"
      - "別プロセス実行（Subagent 起動の内部実装に依存）"
  high_impact_categories:
    - "security_or_authorization"
    - "secret_or_sensitive_data"
    - "data_deletion_or_migration"
    - "breaking_external_api"
    - "irreversible_architecture"
    - "unapproved_cost_or_schedule"
    - "must_requirement_conflict"

# ------------------------------------------------------------
# (2j) cross_repo_knowledge — クロスリポジトリ知識リンクスキル（オプション生成）
#   Phase 1.5 の AskQuestion で生成有無を決定する。
#   enabled: true の場合のみ outputs[] の feature: cross_repo_knowledge エントリが生成対象になる。
#   関連リポジトリの知識参照を wrapper（bin/cross-repo-sync-safe）経由で安全に実行する。
#   git clone / fetch / checkout / pull はすべて wrapper 経由で行い、
#   AI が直接 git コマンドを実行しない設計。
# ------------------------------------------------------------
cross_repo_knowledge:
  enabled: false
  clone_base_path: "/tmp/cross-repo-knowledge"
  git_protocol: "ssh"

# ------------------------------------------------------------
# (2b) outputs — 生成対象ファイルの機械可読カタログ（audit/generate の SoT）
#   mode: render = テンプレート全展開 / marker = マーカーブロックを既存ファイルへ upsert
